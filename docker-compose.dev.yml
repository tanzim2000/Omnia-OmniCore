# Identical to docker-compose.yml except it builds the image from the source
# in this folder instead of pulling a published one, so your local changes
# are what actually runs.
#
# The version reports as "dev", which is deliberate: a local build isn't a
# release, and OmniCore should never mistake it for one or try to "update"
# a work-in-progress out from under you.

services:
  omnicore:
    build:
      context: .
      args:
        OMNICORE_VERSION: dev

    container_name: omnicore-dev
    restart: unless-stopped

    ports:
      - "3000:3000"
      - "1303:1303"
      - "3999:3999"
      - "4000:4000"
      - "4001:4001"
      - "4002:4002"
      - "4003:4003"
      - "4004:4004"
      - "4005:4005"
      - "4006:4006"
      - "4007:4007"
      - "4008:4008"
      - "4009:4009"
      - "4010:4010"

      # Input faces — see docker-compose.yml's own comment on this range
      - "5001:5001"
      - "5002:5002"
      - "5003:5003"
      - "5004:5004"
      - "5005:5005"
      - "5006:5006"
      - "5007:5007"
      - "5008:5008"
      - "5009:5009"
      - "5010:5010"
      - "5011:5011"
      - "5012:5012"
      - "5013:5013"
      - "5014:5014"
      - "5015:5015"
      - "5016:5016"
      - "5017:5017"
      - "5018:5018"
      - "5019:5019"
      - "5020:5020"
      - "5021:5021"
      - "5022:5022"
      - "5023:5023"
      - "5024:5024"
      - "5025:5025"
      - "5026:5026"
      - "5027:5027"
      - "5028:5028"
      - "5029:5029"
      - "5030:5030"
      - "5031:5031"
      - "5032:5032"
      - "5033:5033"
      - "5034:5034"
      - "5035:5035"
      - "5036:5036"
      - "5037:5037"
      - "5038:5038"
      - "5039:5039"
      - "5040:5040"
      - "5041:5041"
      - "5042:5042"
      - "5043:5043"
      - "5044:5044"
      - "5045:5045"
      - "5046:5046"
      - "5047:5047"
      - "5048:5048"
      - "5049:5049"
      - "5050:5050"

    volumes:
      # Separate volumes from the real install, so experimenting here can't
      # damage a working setup on the same machine.
      - omnicore-dev-data:/app/data
      - omnicore-dev-modules:/app/modules
      - omnicore-dev-themes:/app/themes

      # No docker.sock here on purpose. A dev build has nothing to update
      # itself to, so there is no reason to hand it control of the host.

volumes:
  omnicore-dev-data:
  omnicore-dev-modules:
  omnicore-dev-themes: