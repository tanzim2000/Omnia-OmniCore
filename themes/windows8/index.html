<!DOCTYPE html>
<html>
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>Omnia</title>
	<style>
		:root {
			/* Windows 8 Metro: flat solid colours, no gradients or shadows.
			   These are set from the theme's settings when the page loads. */
			--bg: #1d1d1d;
			--tile: #0078d7;
			--text: #ffffff;

			/* Real Metro grid: 70px base unit with 10px gutters, so a
			   medium tile is 150px (70+10+70) and a wide one is 310px */
			--unit: 70px;
			--gutter: 10px;

			/* Animation durations live here and ONLY here. The script
			   waits for the browser to report an animation finished
			   rather than counting to a duration of its own, so there's
			   no second copy that can fall out of step — which is what
			   was cutting the swivel off midway.

			   Depth Swivel is three sequential phases (recess, turn,
			   return), not one motion, so it needs well over twice the
			   Prism Roll's single turn or the stages blur together.

			   --speed is the only thing the script touches: 1 for the
			   unhurried default, 0.5 to run everything twice as fast.
			   Because the real durations are derived from it, the
			   browser's own reported duration stays correct and nothing
			   has to be kept in sync by hand. */
			--speed: 1;
			--roll-ms: calc(620ms * var(--speed));
			--swivel-ms: calc(1500ms * var(--speed));
			--slide-ms: calc(520ms * var(--speed));
		}

		* { box-sizing: border-box; }

		/* The background lives on its own fixed layer rather than on the
		   body. A body-level background is sized to the BODY box, so it
		   rescaled every time a tile changed size — this is pinned to the
		   viewport and stays put. */
		#backdrop {
			position: fixed;
			inset: 0;
			z-index: -1;
			background-color: var(--bg);
			background-size: cover;
			background-position: center;
			background-repeat: no-repeat;
		}

		body {
			background: transparent;
			color: var(--text);
			font-family: "Segoe UI", system-ui, sans-serif;
			font-weight: 300;
			margin: 0;
			padding: 48px 40px;
		}

		h1 {
			font-size: 34px;
			font-weight: 200;
			margin: 0 0 28px 0;
			letter-spacing: -0.01em;
		}

		.tiles {
			display: grid;
			grid-template-columns: repeat(auto-fill, var(--unit));
			grid-auto-rows: var(--unit);
			gap: var(--gutter);
		}

		/* A tile is only a slot in the grid. What you see is the box inside
		   it — a solid object with depth, not a flat card. */
		.tile {
			position: relative;
			perspective: 1200px;
		}

		/* The four authentic Metro sizes */
		.tile.small  { grid-column: span 1; grid-row: span 1; }
		.tile.medium { grid-column: span 2; grid-row: span 2; }
		.tile.wide   { grid-column: span 4; grid-row: span 2; }
		.tile.large  { grid-column: span 4; grid-row: span 4; }

		/* The box's depth equals the tile's HEIGHT. That makes every face
		   around the rotation axis the same shape as the front — which is
		   why it reads as a solid block tumbling rather than a card
		   flipping. Square tiles genuinely are cubes; wide ones are a
		   longer box whose faces still match. */
		.tile.small  { --depth: var(--unit); }
		.tile.medium { --depth: calc(var(--unit) * 2 + var(--gutter)); }
		.tile.wide   { --depth: calc(var(--unit) * 2 + var(--gutter)); }
		.tile.large  { --depth: calc(var(--unit) * 4 + var(--gutter) * 3); }

		.box {
			position: absolute;
			inset: 0;
			transform-style: preserve-3d;
			transform: translateZ(calc(var(--depth) / -2));
		}

		/* Constant-speed motion reads as artificial — real objects take
		   energy to start moving and lose it settling to a stop. Both
		   animations below launch fast and decelerate hard into rest,
		   rather than moving at one even pace the whole way through. */

		/* PRISM ROLL — one continuous 90° turn, no zoom involved. Fast
		   launch, most of the motion happens early, then it eases down
		   into place rather than stopping abruptly. */
		@keyframes tile-roll {
			from { transform: translateZ(calc(var(--depth) / -2)) rotateX(0deg); }
			to   { transform: translateZ(calc(var(--depth) / -2)) rotateX(-90deg); }
		}

		.box.rolling {
			animation: tile-roll var(--roll-ms) cubic-bezier(0.16, 1, 0.3, 1) both;
		}

		/* DEPTH SWIVEL — three phases that never overlap, each with its
		   own feel. A keyframe's timing-function governs the segment
		   LEADING OUT of it, so each phase gets its own easing:
		     0%  -> 18%  recess:  scale down only, quick and punchy
		     18% -> 82%  swivel:  180° turn only, scale held fixed —
		                          fast through the middle, easing down as
		                          the new face finishes aligning
		     82% -> 100% return:  scale back up only, after the turn is
		                          fully resolved, settling in rather than
		                          snapping to size
		   No property moves during more than one phase, which is what
		   keeps the recess from blending into the turn or the return from
		   cutting in early. */
		@keyframes tile-swivel {
			0% {
				transform: translateZ(calc(var(--depth) / -2)) scale(1) rotateX(0deg);
				/* Recess: quick and punchy, dropping back to prepare */
				animation-timing-function: cubic-bezier(0.4, 0, 0.5, 1);
			}
			16% {
				transform: translateZ(calc(var(--depth) / -2)) scale(0.82) rotateX(0deg);
				/* The turn: builds speed, then eases well down as the new
				   face comes into alignment */
				animation-timing-function: cubic-bezier(0.35, 0, 0.15, 1);
			}
			76% {
				transform: translateZ(calc(var(--depth) / -2)) scale(0.82) rotateX(-180deg);
				/* Return: gentle throughout, gliding back flush rather
				   than snapping to size. A hard settle curve here is what
				   made it pop. */
				animation-timing-function: cubic-bezier(0.25, 0.5, 0.3, 1);
			}
			100% {
				transform: translateZ(calc(var(--depth) / -2)) scale(1) rotateX(-180deg);
			}
		}

		.box.swivelling {
			animation: tile-swivel var(--swivel-ms) both;
		}

		.face {
			position: absolute;
			inset: 0;
			background: var(--tile);
			/* White text whatever the page background is, since a tile is
			   always a solid accent colour */
			color: #fff;
			padding: 12px;
			display: flex;
			flex-direction: column;
			overflow: hidden;
			backface-visibility: hidden;
		}

		.tile.small .face { padding: 8px; }

		/* The four faces around the horizontal axis. Rotating the box brings
		   whichever one we want to the front. */
		.face.front  { transform: translateZ(calc(var(--depth) / 2)); }
		.face.top    { transform: rotateX(90deg) translateZ(calc(var(--depth) / 2)); }
		.face.back   { transform: rotateX(180deg) translateZ(calc(var(--depth) / 2)); }

		/* Simplified animation: no 3D whatsoever.
		
		   Every part of the 3D setup has to go together. Leaving the
		   perspective and the faces' own translateZ in place while only
		   neutralising the box pushed the front face TOWARDS the viewer
		   instead of flush — which is why every tile rendered oversized
		   and overlapped its neighbours. Half-undoing 3D is worse than
		   not touching it. */
		.simplified .tile { perspective: none; }

		.simplified .box {
			transform: none;
			transform-style: flat;
			animation: none;
		}

		.simplified .face.front { transform: none; padding: 0; }

		.simplified .face.top,
		.simplified .face.back { display: none; }

		/* In simplified mode the face holds cards rather than content
		   directly. A card is a full-size pane the size of the tile — the
		   new one slides in over the old from whichever side, like a card
		   being pushed into a window frame. The face itself loses its
		   padding so a card can cover it edge to edge. */
		.card {
			position: absolute;
			inset: 0;
			background: var(--tile);
			padding: 12px;
			display: flex;
			flex-direction: column;
			overflow: hidden;
		}

		.tile.small .card { padding: 8px; }

		.card.sliding {
			transition: transform var(--slide-ms) cubic-bezier(0.16, 1, 0.3, 1);
		}

		@media (prefers-reduced-motion: reduce) {
			.box.rolling,
			.box.swivelling { animation: none; }
			.card.sliding { transition: none; }
		}

		.body {
			flex: 1;
			display: flex;
			flex-direction: column;
			/* Top-aligned, not centred. Centring pushed overflow out of BOTH
			   ends, and scrollHeight only sees what spills past the bottom —
			   so half the overflow was invisible and trimming under-measured.
			   It's also closer to how Metro actually laid tiles out. */
			justify-content: flex-start;
			min-height: 0;
			overflow: hidden;
		}

		.primary {
			font-weight: 200;
			/* Slightly open so two wrapped lines don't crowd each other */
			line-height: 1.05;
			overflow-wrap: break-word;
		}

		.secondary {
			font-size: 13px;
			opacity: 0.75;
			margin-top: 6px;
			white-space: nowrap;
			overflow: hidden;
			text-overflow: ellipsis;
		}

		/* The tile label sits at the bottom, as it did in Metro */
		.label {
			font-size: 13px;
			font-weight: 400;
			margin-top: 8px;
			white-space: nowrap;
			overflow: hidden;
			text-overflow: ellipsis;
		}

		.body > .pair {
			display: flex;
			justify-content: space-between;
			gap: 14px;
			font-size: 12px;
			opacity: 0.85;
			margin-top: 3px;
		}

		/* Either half of a pair can be long. Let each ellipsis rather than
		   letting one shove the other off the tile. */
		.body > .pair span {
			white-space: nowrap;
			overflow: hidden;
			text-overflow: ellipsis;
		}

		.body > .pair span:last-child { flex-shrink: 0; }

		.body > .body {
			font-size: 13px;
			opacity: 0.9;
			overflow: hidden;
			text-overflow: ellipsis;
		}

		.quote {
			font-size: 15px;
			font-style: italic;
			font-weight: 300;
			line-height: 1.35;
			opacity: 0.95;
		}

		/* An image fills the face and sits behind the text */
		.tile-image {
			position: absolute;
			inset: 0;
			background-position: center;
			background-repeat: no-repeat;
		}

		/* Text over an image needs help staying readable */
		.tile-image ~ .body,
		.tile-image ~ .label {
			position: relative;
			text-shadow: 0 1px 4px rgba(0, 0, 0, 0.7);
		}

		.progress {
			height: 3px;
			background: rgba(255, 255, 255, 0.25);
			margin-top: 8px;
		}

		.progress div { height: 100%; background: #fff; }

		/* Everything scales with the tile it lives in — a small tile with
		   13px text runs out of room long before the words do */
		.tile.small  .primary { font-size: 18px; }
		.tile.medium .primary { font-size: 26px; }
		.tile.wide   .primary { font-size: 44px; }
		.tile.large  .primary { font-size: 56px; }

		.tile.small  .label { font-size: 10px; margin-top: 4px; }
		.tile.medium .label { font-size: 12px; }

		.tile.small  .secondary { font-size: 11px; margin-top: 3px; }
		.tile.medium .secondary { font-size: 12px; }
	</style>
</head>
<body>
	<div id="backdrop"></div>
	<h1 id="face-title"></h1>
	<div class="tiles" id="tiles"></div>

	<script>
		// The sizes this theme offers, and how much content each one asks a
		// module for. The richness scale belongs to the MODULE — it decides
		// what 10 means versus 95 — and this is the theme author's judgement
		// about how much room each size really has. Hardcoded here on
		// purpose: it's a design decision, not something to configure.
		const SIZES = {
			hidden: { richness: 0, perPage: 0 },
			small: { richness: 10, perPage: 1 },
			medium: { richness: 35, perPage: 3 },
			wide: { richness: 65, perPage: 5 },
			large: { richness: 95, perPage: 10 }
		};

		// The accent colours Windows 8 actually offered
		const ACCENTS = {
			Blue: "#0078d7",
			Teal: "#00b294",
			Green: "#107c10",
			Orange: "#d83b01",
			Red: "#e81123",
			Purple: "#5c2d91",
			Magenta: "#b4009e",
			Slate: "#515c6b"
		};

		// How big a tile is. A bigger screen can carry more, smaller tiles;
		// a small one is better off with fewer, larger ones.
		const TILE_UNITS = {
			Compact: "56px",
			Normal: "70px",
			Large: "88px",
			Huge: "110px"
		};

		// No durations here on purpose. They live in the stylesheet, and
		// the browser tells us when an animation has finished — see
		// whenFinished below. Keeping a second copy in JS is what cut the
		// swivel off halfway when the two drifted apart.

		// Tiles shouldn't all turn at once — a grid where everything moves
		// together looks mechanical. Each tile picks its own interval in
		// this range, so the wall feels alive rather than synchronised.
		const PAGE_MIN_MS = 4000;
		const PAGE_MAX_MS = 12000;

		let identity = null;

		// Flat sliding cards instead of tumbling 3D
		let simplified = false;

		// Everything we're tracking per tile, keyed by instance id
		const tiles = new Map();

		function escapeHtml(text) {
			return String(text).replace(/[&<>"]/g, function (character) {
				return {
					"&": "&amp;",
					"<": "&lt;",
					">": "&gt;",
					'"': "&quot;"
				}[character];
			});
		}

		// ---- theme settings -------------------------------------------

		// Rough perceived brightness of a colour, 0 to 1. Used to decide
		// whether text over it should be dark or light, so a pale background
		// doesn't end up with white text on it.
		function brightness(hex) {
			const value = String(hex || "").replace("#", "");
			if (value.length !== 6) return 0;

			const r = parseInt(value.slice(0, 2), 16);
			const g = parseInt(value.slice(2, 4), 16);
			const b = parseInt(value.slice(4, 6), 16);

			// Green reads brighter to the eye than red, and red than blue
			return (r * 0.299 + g * 0.587 + b * 0.114) / 255;
		}

		function applyThemeSettings(config) {
			const accent = ACCENTS[config.accent] || ACCENTS.Blue;
			const colour = config.backgroundColor || "#1d1d1d";
			const colour2 = config.backgroundColor2 || "#3a3a3a";

			const root = document.documentElement.style;
			root.setProperty("--tile", accent);
			root.setProperty("--unit", TILE_UNITS[config.tileSize] || TILE_UNITS.Normal);
			root.setProperty("--bg", colour);

			simplified =
				config.simplifyAnimation === true ||
				config.simplifyAnimation === "true";

			document.body.classList.toggle("simplified", simplified);

			// Gentle motion is the unhurried default. Turning it off halves
			// every duration — the stylesheet derives them all from this
			// one multiplier, so nothing else has to change.
			const unhurried =
				config.gentleMotion === undefined ||
				config.gentleMotion === true ||
				config.gentleMotion === "true";

			root.setProperty("--speed", unhurried ? "1" : "0.5");

			const backdrop = document.getElementById("backdrop");

			backdrop.style.backgroundImage =
				config.background === "Gradient"
					? "linear-gradient(160deg, " + colour + ", " + colour2 + ")"
					: "";

			// Work out the text colour rather than making it another setting
			// to get wrong. A wallpaper could be anything, so assume dark.
			const light =
				config.background === "Wallpaper" ? false : brightness(colour) > 0.6;

			root.setProperty("--text", light ? "#1a1a1a" : "#ffffff");
		}

		// The wallpaper comes from whichever instance the user nominated —
		// any module producing a background can serve the role, and the
		// module itself has no idea it's being used this way.
		function applyWallpaper(fetched) {
			const config = identity.themeConfig || {};

			if (config.background !== "Wallpaper" || !config.wallpaper) {
				return;
			}

			const result = fetched.find(function (entry) {
				return entry.instance.id === config.wallpaper;
			});

			// Leave whatever is already showing rather than blanking the
			// screen because one fetch failed
			if (!result || !result.data) {
				return;
			}

			const blocks = result.data.content || [];

			const picture =
				blocks.find(function (b) { return b.type === "background" && b.url; }) ||
				blocks.find(function (b) { return b.type === "image" && b.url; });

			document.getElementById("backdrop").style.backgroundImage = picture
				? "url(" + picture.url + ")"
				: "";
		}

		// ---- rendering ------------------------------------------------

		// A module hands us content BLOCKS describing what it has. We decide
		// entirely how each one looks — that's the whole split.
		//
		// A block type we don't recognise falls back to its plain-text form,
		// so a module using something newer than this theme still works,
		// just plainer.
		function renderBlock(block) {
			if (block.type === "text") {
				const cls = block.emphasis === "primary" ? "primary"
					: block.emphasis === "secondary" ? "secondary" : "body";

				return '<div class="' + cls + '">' +
					escapeHtml(block.value || "") + "</div>";
			}

			if (block.type === "quote") {
				return '<div class="quote">' + escapeHtml(block.value || "") + "</div>";
			}

			if (block.type === "pair") {
				return '<div class="pair"><span>' + escapeHtml(block.label) +
					"</span><span>" + escapeHtml(block.value) + "</span></div>";
			}

			if (block.type === "image") {
				return '<div class="tile-image" style="background-image:url(' +
					encodeURI(block.url) + ');background-size:' +
					(block.fit === "contain" ? "contain" : "cover") + '"></div>';
			}

			// A background belongs to the page, not to a tile
			if (block.type === "background") {
				return "";
			}

			if (block.type === "progress") {
				const pct = Math.max(0, Math.min(1, Number(block.value))) * 100;
				return '<div class="progress"><div style="width:' + pct + '%"></div></div>';
			}

			// Unknown type — show whatever plain text it gave us
			return block.text
				? '<div class="body">' + escapeHtml(block.text) + "</div>"
				: "";
		}

		// Split a module's blocks into faces this tile can show one at a
		// time. A module honouring richness should mostly come back with
		// one page's worth — but if it sends more, we page through it
		// rather than silently dropping the rest.
		function paginate(data, size) {
			const blocks = data.content || [];
			const perPage = SIZES[size].perPage;

			// Images stay behind the text on every page
			const images = blocks.filter(function (b) { return b.type === "image"; });
			const rest = blocks.filter(function (b) {
				return b.type !== "image" && b.type !== "background";
			});

			const label = '<div class="label">' +
				escapeHtml(data.title || "") + "</div>";

			const backdrop = images.map(renderBlock).join("");
			const pages = [];

			for (let at = 0; at < rest.length; at += perPage) {
				pages.push(
					backdrop +
					'<div class="body">' +
						rest.slice(at, at + perPage).map(renderBlock).join("") +
					"</div>" +
					label
				);
			}

			// A module with nothing to say still gets a face
			if (!pages.length) {
				pages.push(backdrop + '<div class="body"></div>' + label);
			}

			return pages;
		}

		function renderUnavailable(instance) {
			return '<div class="body">' +
					'<div class="primary">—</div>' +
					'<div class="secondary">Not responding</div>' +
				"</div>" +
				'<div class="label">' +
					escapeHtml(instance.label || instance.module) + "</div>";
		}

		// Richness should mean a module returns roughly what fits, but a
		// module can send anything. This drops what still doesn't fit so
		// nothing overflows a face, whatever arrives.
		function trimToFit(face) {
			const body = face.querySelector(".body");
			if (!body) return;

			// Least important first: pairs, then plain body text. The primary
			// value, its label and the tile name always survive.
			for (const selector of [".pair", ".body"]) {
				let rows = body.querySelectorAll(":scope > " + selector);

				while (rows.length > 0 && face.scrollHeight > face.clientHeight) {
					rows[rows.length - 1].remove();
					rows = body.querySelectorAll(":scope > " + selector);
				}
			}
		}

		// ---- tiles ----------------------------------------------------

		// The size comes from this instance's theme settings, chosen in the
		// admin face. The theme reads it; it never sets it.
		function sizeOf(instance) {
			const chosen = String((instance.themeConfig || {}).size || "").toLowerCase();
			return SIZES[chosen] ? chosen : "wide";
		}

		function makeTile(instance) {
			const tile = document.createElement("div");
			tile.className = "tile " + sizeOf(instance);
			tile.dataset.instance = instance.id;

			const box = document.createElement("div");
			box.className = "box";

			for (const which of ["front", "top", "back"]) {
				const face = document.createElement("div");
				face.className = "face " + which;
				box.appendChild(face);
			}

			tile.appendChild(box);
			return tile;
		}

		function facesOf(tile) {
			return {
				box: tile.querySelector(".box"),
				front: tile.querySelector(".face.front"),
				top: tile.querySelector(".face.top"),
				back: tile.querySelector(".face.back")
			};
		}

		// Run `done` when an animation or transition on `element` has
		// genuinely finished.
		//
		// The browser knows exactly when that is; the script doesn't need
		// to, and shouldn't guess. A guessed duration is a second copy of
		// a number that lives in the stylesheet, and when the two drift
		// the animation gets cut off partway through.
		//
		// The fallback timer covers the case where no event ever arrives —
		// reduced-motion turns the animation off entirely, and a tile
		// scrolled out of view may never fire. It reads the duration the
		// browser actually resolved, so it still isn't guessing.
		function whenFinished(element, eventName, done) {
			let settled = false;

			function finish() {
				if (settled) return;
				settled = true;

				element.removeEventListener(eventName, onEvent);
				clearTimeout(timer);
				done();
			}

			function onEvent(event) {
				// Ignore anything bubbling up from content inside the tile
				if (event.target !== element) return;
				finish();
			}

			element.addEventListener(eventName, onEvent);

			const style = getComputedStyle(element);
			const raw =
				eventName === "animationend"
					? style.animationDuration
					: style.transitionDuration;

			// "1.5s" or "520ms", possibly a comma-separated list
			const first = String(raw).split(",")[0].trim();
			const ms = first.endsWith("ms")
				? parseFloat(first)
				: parseFloat(first) * 1000;

			const timer = setTimeout(finish, (ms || 0) + 120);
		}

		// Put content on the front face with no animation at all
		function showAtOnce(tile, html) {
			const { box, front } = facesOf(tile);

			box.className = "box";
			box.style.transform = "";

			if (simplified) {
				// The face has no padding in this mode, so content always
				// lives inside a card rather than directly on the face
				const card = document.createElement("div");
				card.className = "card";
				card.innerHTML = html;

				front.innerHTML = "";
				front.appendChild(card);
				trimToFit(card);
				return;
			}

			front.innerHTML = html;
			trimToFit(front);
		}

		// THE PRISM ROLL — a 90 degree turn.
		//
		// The next face is already sitting at a right angle to the one you're
		// looking at. As the front rolls back and away, that face rolls up
		// into its place. Both are moving together, because they're two
		// faces of the same solid block — there's no moment where the tile is
		// edge-on and empty the way a card flip has.
		//
		// For cycling between pieces of the same information.
		function prismRoll(tile, html, done) {
			const { box, front, top } = facesOf(tile);

			top.innerHTML = html;
			trimToFit(top);

			// The keyframes in the stylesheet drive the whole motion —
			// adding the class is all this needs to do. No inline
			// transform here: an inline style would outrank the animation
			// and the tile just wouldn't move.
			box.classList.add("rolling");

			whenFinished(box, "animationend", function () {
				// The turn is over. Move what's now in view onto the front
				// face and drop the animation class — the box's resting
				// CSS rule puts it back exactly where the keyframes left
				// it, so nothing jumps.
				box.classList.remove("rolling");
				front.innerHTML = top.innerHTML;
				top.innerHTML = "";

				if (done) done();
			});
		}

		// THE DEPTH SWIVEL — a 180 degree turn, with room made for it.
		//
		// The tile shrinks back into the screen first, opening space around
		// itself in the grid. Then the whole block turns half a revolution,
		// and because it's a solid object with real depth you catch its
		// blank side face sweeping past mid-turn. Then it comes back forward
		// to sit flush again.
		//
		// The shrink isn't decoration: a box swinging through 90 degrees
		// takes up more width than its resting footprint, and without it the
		// corners would cut into the neighbouring tiles.
		//
		// For genuinely new information arriving.
		function depthSwivel(tile, html, done) {
			const { box, front, back } = facesOf(tile);

			back.innerHTML = html;
			trimToFit(back);

			// The three-phase recess/swivel/return motion lives entirely in
			// the tile-swivel keyframes, each phase with its own easing.
			// Nothing here needs to know the choreography.
			box.classList.add("swivelling");

			whenFinished(box, "animationend", function () {
				box.classList.remove("swivelling");
				front.innerHTML = back.innerHTML;
				back.innerHTML = "";

				if (done) done();
			});
		}

		// THE SLIDING CARD — flat, no rotation, no perspective.
		//
		// A new card carrying the new content slides in over the old one
		// from the left or the right, like a card being pushed into a
		// window frame. Nothing rotates and nothing moves in depth, which
		// is the whole point: it's the option for anyone who finds the
		// tumbling motion uncomfortable.
		//
		// The side is picked at random each time so a wall of tiles doesn't
		// look like it's all sliding one way.
		function slideCard(tile, html, done) {
			const { front } = facesOf(tile);

			const incoming = document.createElement("div");
			incoming.className = "card";
			incoming.innerHTML = html;

			const fromRight = Math.random() < 0.5;
			incoming.style.transform =
				"translateX(" + (fromRight ? "100%" : "-100%") + ")";

			front.appendChild(incoming);
			trimToFit(incoming);

			// Let the browser place the card off to the side before we
			// animate it back, or it jumps straight to the end
			void incoming.offsetWidth;

			incoming.classList.add("sliding");
			incoming.style.transform = "translateX(0)";

			whenFinished(incoming, "transitionend", function () {
				// The card that just arrived becomes the resting one —
				// no need to rebuild it, just drop what it covered
				incoming.classList.remove("sliding");
				incoming.style.transform = "";

				front.innerHTML = "";
				front.appendChild(incoming);

				if (done) done();
			});
		}

		// ---- what moves, and when -------------------------------------

		// Show a page on a tile, choosing the motion that suits the reason.
		//
		//   new information arrived  -> depth swivel
		//   same data, another page  -> prism roll
		//   simplified animation on   -> sliding card, whatever the reason
		function present(state, html, reason) {
			const tile = state.element;

			if (state.busy) {
				// Something arrived mid-turn. Hold onto it and show it when
				// the current motion finishes — dropping it would mean a
				// tile quietly stuck on stale data until the next change
				// happened to land at a convenient moment.
				state.pending = { html: html, reason: reason };
				return;
			}

			if (state.blank) {
				// Nothing there yet, so there's nothing to turn away from
				state.blank = false;
				showAtOnce(tile, html);
				return;
			}

			state.busy = true;

			const finished = function () {
				state.busy = false;

				const waiting = state.pending;

				if (waiting) {
					state.pending = null;
					present(state, waiting.html, waiting.reason);
				}
			};

			if (simplified) {
				slideCard(tile, html, finished);
			} else if (reason === "changed") {
				depthSwivel(tile, html, finished);
			} else {
				prismRoll(tile, html, finished);
			}
		}

		// Move a tile to its next page. Only tiles with more than one page
		// do this — a tile showing one complete number shouldn't animate
		// just to look busy.
		function turnPage(state) {
			if (state.pages.length < 2) return;

			state.page = (state.page + 1) % state.pages.length;
			present(state, state.pages[state.page], "page");
		}

		function schedulePaging(state) {
			clearTimeout(state.timer);

			if (state.pages.length < 2) return;

			// Each tile picks its own interval, so the grid doesn't turn in
			// lockstep
			const wait =
				PAGE_MIN_MS + Math.random() * (PAGE_MAX_MS - PAGE_MIN_MS);

			state.timer = setTimeout(function () {
				turnPage(state);
				schedulePaging(state);
			}, wait);
		}

		// ---- refresh --------------------------------------------------

		async function refresh() {
			// Re-read our own settings first. A change saved in the admin
			// face normally arrives as a push, but if that push is ever
			// missed the dashboard would sit on stale settings until
			// somebody reloaded it by hand. Checking here costs one cheap
			// request and makes the display self-correcting.
			try {
				const fresh = await (await fetch("/identity")).json();
				const before = JSON.stringify(identity.themeConfig || {});
				const after = JSON.stringify(fresh.themeConfig || {});

				identity = fresh;

				if (before !== after) {
					applyThemeSettings(identity.themeConfig || {});

					// Switching between 3D and flat changes how a tile is
					// built, so existing tiles have to be discarded rather
					// than reused
					for (const [, state] of tiles) {
						clearTimeout(state.timer);
						state.element.remove();
					}
					tiles.clear();
					document.getElementById("tiles").innerHTML = "";
				}
			} catch (error) {
				// Couldn't reach OmniCore — carry on with what we have
			}

			// Every instance is asked at once rather than one after another,
			// so the slowest module doesn't hold up the tiles behind it.
			//
			// Instances sized Hidden are still fetched — a wallpaper source
			// has no tile but very much still has a job.
			const fetched = await Promise.all(
				identity.instances.map(async function (instance) {
					const size = sizeOf(instance);

					// Ask for as much as this size can actually show. The
					// module decides what that number means for its content.
					const richness = SIZES[size].richness || 1;

					try {
						const response = await fetch(
							"/api/" + instance.id + "?richness=" + richness
						);
						if (!response.ok) throw new Error();
						return { instance: instance, data: await response.json() };
					} catch (error) {
						return { instance: instance, data: null };
					}
				})
			);

			const container = document.getElementById("tiles");
			const wanted = [];

			for (const result of fetched) {
				const instance = result.instance;
				const size = sizeOf(instance);

				if (size === "hidden") continue;

				wanted.push(instance.id);

				let state = tiles.get(instance.id);

				if (!state) {
					const element = makeTile(instance);
					container.appendChild(element);

					state = {
						element: element,
						pages: [],
						page: 0,
						blank: true,
						busy: false,
						pending: null,
						timer: null,
						signature: null
					};

					tiles.set(instance.id, state);
				}

				// The size may have changed in settings since the last look
				state.element.className = "tile " + size;

				const pages = result.data
					? paginate(result.data, size)
					: [renderUnavailable(instance)];

				// Only turn the tile when what it's showing actually
				// changed. A tile whose numbers held steady stays still.
				const signature = pages.join("\u0000");

				if (signature === state.signature) {
					continue;
				}

				state.signature = signature;
				state.pages = pages;
				state.page = 0;

				present(state, pages[0], "changed");
				schedulePaging(state);
			}

			// Drop tiles for instances no longer on this face
			for (const [id, state] of tiles) {
				if (wanted.indexOf(id) === -1) {
					clearTimeout(state.timer);
					state.element.remove();
					tiles.delete(id);
				}
			}

			// The wallpaper comes out of the same pass rather than a fetch of
			// its own, so it stays current without any extra requests
			applyWallpaper(fetched);
		}

		// ---- start ----------------------------------------------------

		async function start() {
			identity = await (await fetch("/identity")).json();

			// The face's title is cosmetic and may be blank, which means no
			// heading at all. Its name is for the admin, not the display.
			const heading = document.getElementById("face-title");

			if (identity.title) {
				heading.textContent = identity.title;
			} else {
				heading.style.display = "none";
			}

			// OmniCore hands us our own settings, already resolved against
			// the defaults we declared in settings.json
			applyThemeSettings(identity.themeConfig || {});

			await refresh();

			// Keep the numbers current — a dashboard showing stale stats is
			// worse than one showing none
			setInterval(refresh, 5000);
		}

		start();
	</script>
</body>
