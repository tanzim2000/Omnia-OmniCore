<!DOCTYPE html>
<html>
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>Omnia</title>
	<style>
		:root {
			/* Windows 8 Metro: flat solid colours, no gradients or shadows.
			   These are set from the theme's settings when the page loads. */
			--bg: #1d1d1d;
			--tile: #0078d7;
			--text: #ffffff;

			/* Real Metro grid: 70px base unit with 10px gutters, so a
			   medium tile is 150px (70+10+70) and a wide one is 310px */
			--unit: 70px;
			--gutter: 10px;
		}

		* { box-sizing: border-box; }

		/* The background lives on its own fixed layer rather than on the
		   body. A body-level background is sized to the BODY box, so it
		   rescaled every time a tile changed size — this is pinned to the
		   viewport and stays put. */
		#backdrop {
			position: fixed;
			inset: 0;
			z-index: -1;
			background-color: var(--bg);
			background-size: cover;
			background-position: center;
			background-repeat: no-repeat;
		}

		body {
			background: transparent;
			color: var(--text);
			font-family: "Segoe UI", system-ui, sans-serif;
			font-weight: 300;
			margin: 0;
			padding: 48px 40px;
		}

		h1 {
			font-size: 34px;
			font-weight: 200;
			margin: 0 0 28px 0;
			letter-spacing: -0.01em;
		}

		.tiles {
			display: grid;
			grid-template-columns: repeat(auto-fill, var(--unit));
			grid-auto-rows: var(--unit);
			gap: var(--gutter);
		}

		/* Metro tiles are fixed sizes — content adapts to the tile,
		   never the other way round */
		/* The tile is only a slot in the grid now. Everything you can see
		   lives on the flip surface inside it — which is the whole point:
		   rotating that turns the entire face of the tile, colour and all,
		   rather than just the words inside a box that stays put. */
		.tile {
			position: relative;
			perspective: 900px;
		}

		/* The four authentic Metro sizes */
		.tile.small  { grid-column: span 1; grid-row: span 1; }
		.tile.medium { grid-column: span 2; grid-row: span 2; }
		.tile.wide   { grid-column: span 4; grid-row: span 2; }
		.tile.large  { grid-column: span 4; grid-row: span 4; }

		/* The visible face of a tile: its colour, its padding, its content.
		   Tiles are updated in place rather than rebuilt, so this element
		   survives a refresh and can be animated. */
		.tile .flip {
			position: absolute;
			inset: 0;
			background: var(--tile);
			/* White text whatever the page background is, since a tile is
			   always a solid accent colour */
			color: #fff;
			padding: 12px;
			display: flex;
			flex-direction: column;
			overflow: hidden;
			transform-origin: center center;
			backface-visibility: hidden;
		}

		/* Half a second each way. Faster than this and the eye never
		   registers the rotation — it just reads as a flicker. */
		.tile .flip.turning {
			transition: transform 0.32s ease-in;
			transform: rotateX(-90deg);
		}

		.tile .flip.returning {
			transition: transform 0.32s ease-out;
			transform: rotateX(0deg);
		}

		.tile.small .flip { padding: 8px; }

		/* A tile that has just appeared or changed size settles in rather
		   than snapping. CSS grid can't animate a span change, so this is
		   the honest approximation. */
		@keyframes tile-settle {
			from { transform: scale(0.94); opacity: 0.6; }
			to   { transform: scale(1); opacity: 1; }
		}

		.tile.settling { animation: tile-settle 0.18s ease-out; }

		@media (prefers-reduced-motion: reduce) {
			.tile .flip.turning,
			.tile .flip.returning { transition: none; }
			.tile.settling { animation: none; }
		}

		.tile .body {
			flex: 1;
			display: flex;
			flex-direction: column;
			/* Top-aligned, not centred. Centring pushed overflow out of BOTH
			   ends, and scrollHeight only sees what spills past the bottom —
			   so half the overflow was invisible and trimming under-measured.
			   It's also closer to how Metro actually laid tiles out. */
			justify-content: flex-start;
			min-height: 0; /* lets flex children actually shrink */
			overflow: hidden;
		}

		.tile .primary {
			font-weight: 200;
			/* Slightly open so two wrapped lines don't crowd each other,
			   unlike the label/secondary text which stay single-line */
			line-height: 1.05;
			overflow-wrap: break-word;
		}

		.tile .secondary {
			font-size: 13px;
			opacity: 0.75;
			margin-top: 6px;
			white-space: nowrap;
			overflow: hidden;
			text-overflow: ellipsis;
		}

		/* The tile label sits at the bottom, as it did in Metro */
		.tile .label {
			font-size: 13px;
			font-weight: 400;
			margin-top: 8px;
			white-space: nowrap;
			overflow: hidden;
			text-overflow: ellipsis;
		}

		.tile .body > .pair {
			display: flex;
			justify-content: space-between;
			gap: 14px;
			font-size: 12px;
			opacity: 0.85;
			margin-top: 3px;
		}

		/* Either half of a pair can be long. Let each ellipsis rather than
		   letting one shove the other off the tile. */
		.tile .body > .pair span {
			white-space: nowrap;
			overflow: hidden;
			text-overflow: ellipsis;
		}

		.tile .body > .pair span:last-child { flex-shrink: 0; }

		.tile .body > .body {
			font-size: 13px;
			opacity: 0.9;
			overflow: hidden;
			text-overflow: ellipsis;
		}

		.tile .quote {
			font-size: 15px;
			font-style: italic;
			font-weight: 300;
			line-height: 1.35;
			opacity: 0.95;
		}

		/* An image fills the tile and sits behind the text */
		.tile .tile-image {
			position: absolute;
			inset: 0;
			background-position: center;
			background-repeat: no-repeat;
		}

		/* Text over an image needs help staying readable */
		.tile .tile-image ~ .body,
		.tile .tile-image ~ .label {
			position: relative;
			text-shadow: 0 1px 4px rgba(0, 0, 0, 0.7);
		}

		.tile .progress {
			height: 3px;
			background: rgba(255, 255, 255, 0.25);
			margin-top: 8px;
		}

		.tile .progress div { height: 100%; background: #fff; }

		/* Everything scales with the tile it lives in — a small tile with
		   13px text runs out of room long before the words do */
		.tile.small  .primary { font-size: 18px; }
		.tile.medium .primary { font-size: 26px; }
		.tile.wide   .primary { font-size: 44px; }
		.tile.large  .primary { font-size: 56px; }

		.tile.small  .label { font-size: 10px; margin-top: 4px; }
		.tile.medium .label { font-size: 12px; }

		.tile.small  .secondary { font-size: 11px; margin-top: 3px; }
		.tile.medium .secondary { font-size: 12px; }



		/* Content adapts to the tile. These target the block classes the
		   renderer actually emits — pairs are the first thing to go, since
		   they're the least important thing on a tile. */
		.tile.small .body > .secondary,
		.tile.small .body > .pair,
		.tile.small .body > .progress,
		.tile.small .body > .quote { display: none; }

		.tile.medium .body > .pair { display: none; }
	</style></head>
<body>
	<div id="backdrop"></div>
	<h1 id="face-title"></h1>
	<div class="tiles" id="tiles"></div>

	<script>
		// The sizes this theme offers. These are the values it declared in
		// instance-settings.json — OmniCore puts that field on each
		// instance's settings form and hands the choice back through
		// /identity. The theme never writes anything.
		const SIZES = ["hidden", "small", "medium", "wide", "large"];

		// The accent colours Windows 8 actually offered
		const ACCENTS = {
			Blue: "#0078d7",
			Teal: "#00b294",
			Green: "#107c10",
			Orange: "#d83b01",
			Red: "#e81123",
			Purple: "#5c2d91",
			Magenta: "#b4009e",
			Slate: "#515c6b"
		};

		// How big a tile is. A bigger screen can carry more, smaller tiles;
		// a small one is better off with fewer, larger ones.
		const TILE_UNITS = {
			Compact: "56px",
			Normal: "70px",
			Large: "88px",
			Huge: "110px"
		};

		// Long enough to actually read as a rotation. Much under this and
		// the eye sees a flicker rather than a flip.
		const FLIP_MS = 320;

		let identity = null;

		function escapeHtml(text) {
			return String(text).replace(/[&<>"]/g, function (character) {
				return {
					"&": "&amp;",
					"<": "&lt;",
					">": "&gt;",
					'"': "&quot;"
				}[character];
			});
		}

		// ---- theme settings -------------------------------------------

		// Rough perceived brightness of a colour, 0 to 1. Used to decide
		// whether text over it should be dark or light, so a pale background
		// doesn't end up with white text on it.
		function brightness(hex) {
			const value = String(hex || "").replace("#", "");
			if (value.length !== 6) return 0;

			const r = parseInt(value.slice(0, 2), 16);
			const g = parseInt(value.slice(2, 4), 16);
			const b = parseInt(value.slice(4, 6), 16);

			// Green reads brighter to the eye than red, and red than blue
			return (r * 0.299 + g * 0.587 + b * 0.114) / 255;
		}

		// Apply whatever the theme was configured with. Unknown values fall
		// back to the defaults rather than producing an unstyled page.
		function applyThemeSettings(config) {
			const accent = ACCENTS[config.accent] || ACCENTS.Blue;
			const colour = config.backgroundColor || "#1d1d1d";
			const colour2 = config.backgroundColor2 || "#3a3a3a";

			const root = document.documentElement.style;
			root.setProperty("--tile", accent);
			root.setProperty("--unit", TILE_UNITS[config.tileSize] || TILE_UNITS.Normal);
			root.setProperty("--bg", colour);

			const backdrop = document.getElementById("backdrop");

			backdrop.style.backgroundImage =
				config.background === "Gradient"
					? "linear-gradient(160deg, " + colour + ", " + colour2 + ")"
					: "";

			// Work out the text colour rather than making it another setting
			// to get wrong. A wallpaper could be anything, so assume dark.
			const light =
				config.background === "Wallpaper" ? false : brightness(colour) > 0.6;

			root.setProperty("--text", light ? "#1a1a1a" : "#ffffff");
		}

		// The wallpaper comes from whichever instance the user nominated —
		// any module producing a background can serve the role, and the
		// module itself has no idea it's being used this way.
		function applyWallpaper(fetched) {
			const config = identity.themeConfig || {};

			if (config.background !== "Wallpaper" || !config.wallpaper) {
				return;
			}

			const result = fetched.find(function (entry) {
				return entry.instance.id === config.wallpaper;
			});

			// Leave whatever is already showing rather than blanking the
			// screen because one fetch failed
			if (!result || !result.data) {
				return;
			}

			const blocks = result.data.content || [];

			// A background block is the module saying "this is meant to go
			// behind everything". Failing that, any image it offers will do —
			// the user did nominate this instance, after all.
			const picture =
				blocks.find(function (b) { return b.type === "background" && b.url; }) ||
				blocks.find(function (b) { return b.type === "image" && b.url; });

			document.getElementById("backdrop").style.backgroundImage = picture
				? "url(" + picture.url + ")"
				: "";
		}

		// ---- rendering ------------------------------------------------

		// A module hands us content BLOCKS describing what it has. We decide
		// entirely how each one looks — that's the whole split.
		//
		// A block type we don't recognise falls back to its plain-text form,
		// so a module using something newer than this theme still works,
		// just plainer.
		function renderBlock(block) {
			if (block.type === "text") {
				const cls = block.emphasis === "primary" ? "primary"
					: block.emphasis === "secondary" ? "secondary" : "body";

				return '<div class="' + cls + '">' +
					escapeHtml(block.value || "") + "</div>";
			}

			if (block.type === "quote") {
				return '<div class="quote">' + escapeHtml(block.value || "") + "</div>";
			}

			if (block.type === "pair") {
				return '<div class="pair"><span>' + escapeHtml(block.label) +
					"</span><span>" + escapeHtml(block.value) + "</span></div>";
			}

			if (block.type === "image") {
				return '<div class="tile-image" style="background-image:url(' +
					encodeURI(block.url) + ');background-size:' +
					(block.fit === "contain" ? "contain" : "cover") + '"></div>';
			}

			// A background belongs to the page, not to a tile — it's handled
			// separately and draws nothing here
			if (block.type === "background") {
				return "";
			}

			if (block.type === "progress") {
				const pct = Math.max(0, Math.min(1, Number(block.value))) * 100;
				return '<div class="progress"><div style="width:' + pct + '%"></div></div>';
			}

			// Unknown type — show whatever plain text it gave us
			return block.text
				? '<div class="body">' + escapeHtml(block.text) + "</div>"
				: "";
		}

		// The inside of a tile's face.
		function renderContents(data) {
			const blocks = data.content || [];

			// Images fill the tile, so they sit behind everything else.
			// Backgrounds are page-level and never appear on a tile.
			const images = blocks.filter(function (b) { return b.type === "image"; });
			const rest = blocks.filter(function (b) {
				return b.type !== "image" && b.type !== "background";
			});

			return images.map(renderBlock).join("") +
				'<div class="body">' + rest.map(renderBlock).join("") + "</div>" +
				'<div class="label">' + escapeHtml(data.title || "") + "</div>";
		}

		function renderUnavailable(instance) {
			return '<div class="body">' +
					'<div class="primary">—</div>' +
					'<div class="secondary">Not responding</div>' +
				"</div>" +
				'<div class="label">' +
					escapeHtml(instance.label || instance.module) + "</div>";
		}

		// The size rules in CSS cover the expected cases, but a module can
		// return any number of blocks. This drops what still doesn't fit so
		// no module can overflow a tile, whatever it sends.
		function trimToFit(flip) {
			const body = flip.querySelector(".body");
			if (!body) return;

			// Least important first: pairs, then plain body text. The primary
			// value, its label and the tile name always survive.
			for (const selector of [".pair", ".body"]) {
				let rows = body.querySelectorAll(":scope > " + selector);

				while (rows.length > 0 && flip.scrollHeight > flip.clientHeight) {
					rows[rows.length - 1].remove();
					rows = body.querySelectorAll(":scope > " + selector);
				}
			}
		}

		// ---- tiles ----------------------------------------------------

		// The size comes from this instance's theme settings, chosen in the
		// admin face. The theme reads it; it never sets it.
		function sizeOf(instance) {
			const chosen = String((instance.themeConfig || {}).size || "").toLowerCase();
			return SIZES.indexOf(chosen) === -1 ? "wide" : chosen;
		}

		// Hidden is a size like any other here — the module still runs and
		// still supplies data, it just isn't drawn. That's how a wallpaper
		// source earns its keep without taking up a slot.
		function isHidden(instance) {
			return sizeOf(instance) === "hidden";
		}

		function makeTile(instance) {
			const tile = document.createElement("div");
			tile.className = "tile " + sizeOf(instance);
			tile.dataset.instance = instance.id;

			const flip = document.createElement("div");
			flip.className = "flip";
			tile.appendChild(flip);

			return tile;
		}

		// Put new content into a tile. If it actually differs, the tile flips
		// to reveal it, the way a live tile did — rather than the text simply
		// blinking into something else.
		function setContents(tile, html) {
			const flip = tile.querySelector(".flip");

			if (flip.dataset.html === html) {
				return; // nothing changed, so nothing should move
			}

			const first = flip.dataset.html === undefined;
			flip.dataset.html = html;

			if (first) {
				flip.innerHTML = html;
				trimToFit(flip);
				return;
			}

			// Turn the old face away...
			flip.classList.remove("returning");
			flip.classList.add("turning");

			setTimeout(function () {
				// ...swap it while edge-on, where nothing is visible...
				flip.classList.remove("turning");
				flip.innerHTML = html;
				trimToFit(flip);

				// ...then bring the new face back round. The reflow forces
				// the browser to notice the rotated state before we animate
				// out of it, otherwise it jumps straight to the end.
				void flip.offsetWidth;
				flip.classList.add("returning");

				setTimeout(function () {
					flip.classList.remove("returning");
				}, FLIP_MS);
			}, FLIP_MS);
		}

		// ---- refresh --------------------------------------------------

		async function refresh() {
			// Every instance is asked at once rather than one after another,
			// so the slowest module doesn't hold up the tiles behind it.
			//
			// Instances sized Hidden are still fetched — a wallpaper source
			// has no tile but very much still has a job.
			const fetched = await Promise.all(
				identity.instances.map(async function (instance) {
					try {
						const response = await fetch("/api/" + instance.id);
						if (!response.ok) throw new Error();
						return { instance: instance, data: await response.json() };
					} catch (error) {
						return { instance: instance, data: null };
					}
				})
			);

			const container = document.getElementById("tiles");
			const wanted = [];

			for (const result of fetched) {
				if (isHidden(result.instance)) continue;

				wanted.push(result.instance.id);

				// Reuse the tile if it's already there. Rebuilding the grid
				// every few seconds would throw away the very element the
				// flip animates.
				let tile = container.querySelector(
					'[data-instance="' + result.instance.id + '"]'
				);

				if (!tile) {
					tile = makeTile(result.instance);
					container.appendChild(tile);
				} else {
					// The size may have been changed in settings since the
					// last look — a face-changed push reloads the page, but
					// this keeps the class honest either way
					tile.className = "tile " + sizeOf(result.instance);
				}

				setContents(
					tile,
					result.data
						? renderContents(result.data)
						: renderUnavailable(result.instance)
				);
			}

			// Drop tiles for instances that are no longer on this face
			for (const tile of container.querySelectorAll(".tile")) {
				if (wanted.indexOf(tile.dataset.instance) === -1) {
					tile.remove();
				}
			}

			// The wallpaper comes out of the same pass rather than a fetch of
			// its own, so it stays current without any extra requests
			applyWallpaper(fetched);
		}

		// ---- start ----------------------------------------------------

		async function start() {
			// Ask the face who it is and what's on it
			identity = await (await fetch("/identity")).json();

			// The face's title is cosmetic and may be blank, which means no
			// heading at all. Its name is for the admin, not the display.
			const heading = document.getElementById("face-title");

			if (identity.title) {
				heading.textContent = identity.title;
			} else {
				heading.style.display = "none";
			}

			// OmniCore hands us our own settings, already resolved against
			// the defaults we declared in settings.json
			applyThemeSettings(identity.themeConfig || {});

			await refresh();

			// Keep the numbers current — a dashboard showing stale stats is
			// worse than one showing none
			setInterval(refresh, 5000);
		}

		start();
	</script>
</body>
</html>
