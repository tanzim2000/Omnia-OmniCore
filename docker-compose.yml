# The normal way to run OmniCore: docker compose up -d
#
# This pulls a ready-built image from GitHub's registry — nothing is compiled
# on your machine. If you are working ON OmniCore rather than running it, use
# docker-compose.dev.yml instead, which builds from the source in this folder.

services:
  omnicore:
    # ":1" means "the newest OmniCore that is still version 1.x".
    #
    # Bug fixes and new features arrive on their own. A version 2 — which by
    # definition may break things — never arrives silently; upgrading to it
    # is a deliberate edit of this line. That is the whole point of the
    # split: automatic where it is safe, manual where it isn't.
    #
    # Prefer to never move at all? Pin an exact version, e.g. ":1.0.0".
    image: ghcr.io/tanzim2000/omnia-omnicore:1

    container_name: omnicore
    restart: unless-stopped

    ports:
      # Admin — create your account, install things, change settings
      - "3000:3000"
      # Setup wizard — build a new dashboard
      - "4000:4000"
      # Each dashboard you create gets the next number after 4000. Ten
      # reserved here is plenty for a home — if you ever need an
      # eleventh, add "4011:4011" as another line below.
      - "4001:4001"
      - "4002:4002"
      - "4003:4003"
      - "4004:4004"
      - "4005:4005"
      - "4006:4006"
      - "4007:4007"
      - "4008:4008"
      - "4009:4009"
      - "4010:4010"

      # Input faces — a walk-up button for a module that wants one (a tap
      # counter, say). One port per instance that declares an input.json;
      # unused ports here cost nothing. 50 reserved is plenty for a home
      # — add more below the same way as the dashboard range above if you
      # ever need to.
      - "5001:5001"
      - "5002:5002"
      - "5003:5003"
      - "5004:5004"
      - "5005:5005"
      - "5006:5006"
      - "5007:5007"
      - "5008:5008"
      - "5009:5009"
      - "5010:5010"
      - "5011:5011"
      - "5012:5012"
      - "5013:5013"
      - "5014:5014"
      - "5015:5015"
      - "5016:5016"
      - "5017:5017"
      - "5018:5018"
      - "5019:5019"
      - "5020:5020"
      - "5021:5021"
      - "5022:5022"
      - "5023:5023"
      - "5024:5024"
      - "5025:5025"
      - "5026:5026"
      - "5027:5027"
      - "5028:5028"
      - "5029:5029"
      - "5030:5030"
      - "5031:5031"
      - "5032:5032"
      - "5033:5033"
      - "5034:5034"
      - "5035:5035"
      - "5036:5036"
      - "5037:5037"
      - "5038:5038"
      - "5039:5039"
      - "5040:5040"
      - "5041:5041"
      - "5042:5042"
      - "5043:5043"
      - "5044:5044"
      - "5045:5045"
      - "5046:5046"
      - "5047:5047"
      - "5048:5048"
      - "5049:5049"
      - "5050:5050"

    volumes:
      # Everything that makes this YOUR OmniCore rather than a blank one —
      # your account, your dashboards, whatever you've installed. Without
      # this, restarting the container would wipe all of it.
      - omnicore-data:/app/data
      - omnicore-modules:/app/modules
      - omnicore-themes:/app/themes

      # ---------------------------------------------------------------
      # Self-update access.
      #
      # A container cannot replace its own image from the inside. This line
      # hands OmniCore the Docker control socket so it can pull a newer
      # image and recreate itself — the same mechanism Watchtower uses.
      #
      # Understand what you are granting: this is effectively root on the
      # host. Anything OmniCore can do, it can do to every container on
      # this machine, and to the machine itself.
      #
      # Delete this one line and OmniCore still runs perfectly — it will
      # tell you when an update exists instead of applying it, and you
      # update by hand with: docker compose pull && docker compose up -d
      # ---------------------------------------------------------------
      - /var/run/docker.sock:/var/run/docker.sock

volumes:
  omnicore-data:
  omnicore-modules:
  omnicore-themes: