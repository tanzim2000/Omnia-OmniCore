# The normal way to run OmniCore: docker compose up -d
#
# This pulls a ready-built image from GitHub's registry — nothing is compiled
# on your machine. If you are working ON OmniCore rather than running it, use
# docker-compose.dev.yml instead, which builds from the source in this folder.

services:
  omnicore:
    # ":2" means "the newest OmniCore that is still version 2.x".
    #
    # Bug fixes and new features arrive on their own. A new major version
    # (3), which may change more, never arrives silently: Settings offers
    # it, with what's changing, and it's installed only when you press
    # Upgrade. OmniCore then changes this line itself (keeping a copy of
    # this file), so you never have to.
    #
    # Prefer to never move at all? Pin an exact version, e.g. ":2.0.0".
    image: ghcr.io/tanzim2000/omnia-omnicore:2

    container_name: omnicore
    restart: unless-stopped

    # The address other devices use to reach this server, shown on the
    # About tab in Settings. From inside Docker OmniCore can't find it by
    # itself, so it can be written here: an IP or a name, without the
    # port. Optional. To use it, remove the # in front of both lines.
    # environment:
    #   OMNICORE_ADDRESS: 192.168.1.50

    ports:
      # Admin — create your account, install things, change settings
      - "3000:3000"
      # About — a small static info page, no login needed to read it
      - "1303:1303"
      # Setup wizard — build a new dashboard face
      - "3999:3999"
      # Welcome face — pick which dashboard to display
      - "4000:4000"
      # Each dashboard you create gets the next number after 4000. Ten
      # reserved here is plenty for a home — if you ever need an
      # eleventh, add "4011:4011" as another line below.
      - "4001:4001"
      - "4002:4002"
      - "4003:4003"
      - "4004:4004"
      - "4005:4005"
      - "4006:4006"
      - "4007:4007"
      - "4008:4008"
      - "4009:4009"
      - "4010:4010"

      # Inports — a walk-up button for a face that has a module wanting
      # one (a tap counter, say). A face is one ID and two ports: face
      # 001 is Outport 4001 above and Inport 2001 here, paired by
      # arithmetic rather than allocated. One per dashboard face, so
      # this range matches that one exactly; an Inport only listens if
      # its face actually has something taking input.
      - "2001:2001"
      - "2002:2002"
      - "2003:2003"
      - "2004:2004"
      - "2005:2005"
      - "2006:2006"
      - "2007:2007"
      - "2008:2008"
      - "2009:2009"
      - "2010:2010"

    volumes:
      # Everything that makes this YOUR OmniCore rather than a blank one —
      # your account, your dashboards, whatever you've installed. Without
      # this, restarting the container would wipe all of it.
      - omnicore-data:/app/data
      - omnicore-modules:/app/modules
      - omnicore-themes:/app/themes

      # ---------------------------------------------------------------
      # Self-update access.
      #
      # A container cannot replace its own image from the inside. This line
      # hands OmniCore the Docker control socket so it can pull a newer
      # image and recreate itself — the same mechanism Watchtower uses.
      #
      # Understand what you are granting: this is effectively root on the
      # host. Anything OmniCore can do, it can do to every container on
      # this machine, and to the machine itself.
      #
      # Delete this one line and OmniCore still runs perfectly, but its
      # updates are off: it tells you when an update or a new major version
      # exists instead of installing it, and you update by hand with:
      # docker compose pull && docker compose up -d
      # (and, for a new major version, the image line above changed to it)
      # ---------------------------------------------------------------
      - /var/run/docker.sock:/var/run/docker.sock

volumes:
  omnicore-data:
  omnicore-modules:
  omnicore-themes: