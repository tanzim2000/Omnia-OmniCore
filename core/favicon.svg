<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
	<!-- A stand-in until OmniCore has its own icon: a charcoal tile with a
	     ring and a dot in the middle, the core. See core/icon.js to change it. -->
	<defs>
		<linearGradient id="glass" x1="0" y1="0" x2="0" y2="1">
			<stop offset="0" stop-color="#ffffff" stop-opacity="0.16"/>
			<stop offset="0.5" stop-color="#ffffff" stop-opacity="0"/>
		</linearGradient>
	</defs>
	<rect x="2" y="2" width="60" height="60" rx="16" fill="#37393e"/>
	<rect x="2" y="2" width="60" height="60" rx="16" fill="url(#glass)"/>
	<rect x="2.75" y="2.75" width="58.5" height="58.5" rx="15.25" fill="none" stroke="#ffffff" stroke-opacity="0.18" stroke-width="1.5"/>
	<circle cx="32" cy="32" r="15" fill="none" stroke="#eedec5" stroke-width="6"/>
	<circle cx="32" cy="32" r="4.5" fill="#eedec5"/>
</svg>
